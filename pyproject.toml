[project]
name = "prism"
version = "0.1.0"
description = "Prism — AI-curated multi-perspective news briefings"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "feedparser>=6.0.11",
    "resend>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "alembic>=1.14.0",
    "stripe>=10.0",
    "openai>=1.0",
    "pydub>=0.25",
]

[project.scripts]
prism = "prism.cli.app:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/prism/seed.py" = ["E501"]  # static seed data has long lines

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
